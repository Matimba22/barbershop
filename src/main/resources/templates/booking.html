<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | Manyika Hi Mbita's Haircut Barbershop</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <h1>Manyika Hi Mbita's Haircut Barbershop</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/services">Services</a>
            <a href="/about">About</a>
            <a href="/booking">Book Now</a>
            <a href="/contact">Contact</a>
            <a href="/terms">Terms & Conditions</a>
        </nav>
    </header>

    <main class="booking-page">
        <section>
            <h2>Book Your Appointment</h2>

            <p>Select your service, barber, date and preferred time.</p>

            <form id="bookingForm">

                <div>
                    <label for="service">Service</label>
                    <select id="service" name="service" required>
                        <option value="">Select a service</option>
                        <option value="Classic Haircut">Classic Haircut - R180</option>
                        <option value="Fade Haircut">Fade Haircut - R220</option>
                        <option value="Haircut & Beard">Haircut & Beard - R280</option>
                        <option value="Beard Trim">Beard Trim - R120</option>
                        <option value="Kids Haircut">Kids Haircut - R150</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="barber">Barber</label>
                    <select id="barber" name="barber" required>
                        <option value="">Select a barber</option>
                        <option value="Matimba">Matimba</option>
                        <option value="Michael">Michael</option>
                        <option value="Daniel">Daniel</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <br>

                <div>
                    <label for="time">Time</label>
                    <select id="time" name="time" required>
                        <option value="">Select a time</option>
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="12:00">12:00</option>
                        <option value="13:00">13:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name" required>
                </div>

                <br>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required>
                </div>

                <br>

                <div>
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter your phone number" required>
                </div>

                <br>

                <button type="submit">Confirm Booking</button>

            </form>

            <div id="bookingMessage"></div>
            
            <script src="/booking.js"></script>

        </section>
    </main>

</body>
</html>
